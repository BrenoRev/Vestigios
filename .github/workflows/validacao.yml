# Jobs separados para que conteúdo pendente apareça na PR como "Conteúdo",
# e não como código quebrado (ADR-008).

name: Validação

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Formatação (prettier --check)
        run: npm run format:check

      - name: Build (vite build)
        run: npx vite build

  conteudo:
    name: Conteúdo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node puro, sem dependências: não precisa de npm ci.
      - name: Pendências editoriais (check-conteudo)
        run: node scripts/check-conteudo.mjs
